[pytest]
testpaths = tests

markers =
    e2e: toca infraestructura VIVA (API de EMT por red). Excluido del run por defecto; se lanza a proposito con `pytest -m e2e`.

# La suite por defecto es HERMETICA (cero red, cero credenciales): un fallo de
# la API de EMT es estado de un tercero, no un fallo del codigo.
addopts = -m "not e2e"
