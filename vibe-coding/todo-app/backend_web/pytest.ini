[pytest]
testpaths = tests

# La suite es HERMETICA: base de datos SQLite en memoria, cero red, cero servicios
# externos. Eso significa que `make check` da el mismo resultado en tu portatil,
# en el de tu companero y en un servidor. Si algun dia un test necesita algo de
# fuera, no lo metas aqui: marcalo y excluyelo del run por defecto.
addopts = -q
