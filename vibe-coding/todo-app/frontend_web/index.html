<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Le dice al navegador y al sistema operativo de que color es la pagina,
         para que la barra del navegador en movil y los controles nativos
         (scrollbar, selector de fecha) usen el tema correcto. Los dos valores:
         el navegador elige segun el tema del usuario. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfcfc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1413" />
    <title>todo</title>
  </head>
